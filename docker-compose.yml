
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: datosprueba
      MYSQL_ROOT_PASSWORD: qwerty123
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_NAME: datosprueba
      DB_USER: root
      DB_PASSWORD: qwerty123
      DB_HOST: db
      DB_PORT: 3306

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
      - "5174:5174"
    volumes:
      - ./frontend:/app
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  mysql_data: